<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>misKalorias</title>
<meta name="theme-color" content="#f3f3f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">

<style>
/* Layout concept: a one-column phone app. The day's totals are drawn as a nutrition-label panel
   (square corners, heavy black rules, big calorie figure) and everything around it stays soft and quiet.
   Macro colors are the only color; buttons and the calorie meter are plain ink. */
:root{
  color-scheme:light dark;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --page:#f3f3f1; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --line:#e1e0d9; --axis:#c3c2b7; --on-ink:#fcfcfb; --wash:#f0efec;
  --p:#2a78d6; --c:#eb6834; --f:#1baf7a;
  --ok:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --scrim:rgba(11,11,11,.5);
}
@media (prefers-color-scheme: dark){
  :root{
    --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --line:#2c2c2a; --axis:#383835; --on-ink:#0d0d0d; --wash:#242422;
    --p:#3987e5; --c:#d95926; --f:#199e70;
    --scrim:rgba(0,0,0,.65);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font:15px/1.45 var(--font); background:var(--page); color:var(--ink);
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  padding-bottom:calc(112px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--p);outline-offset:2px}
.app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
main{display:flex;flex-direction:column;gap:16px;min-width:0}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
.h1{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.h2{font-size:17px;font-weight:800;letter-spacing:-.01em}
.lede{color:var(--ink2);margin-top:4px;max-width:60ch}
.small{font-size:13px;color:var(--ink2);max-width:62ch}
.num{font-variant-numeric:tabular-nums}
.loading{padding:48px 0;text-align:center;color:var(--ink2)}

.top{display:flex;flex-direction:column;gap:12px}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:900;font-size:22px;letter-spacing:-.03em}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--surface)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--ink2)}

.seg{display:inline-flex;border:1px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--surface);max-width:100%}
.seg button{background:transparent;border:0;font-weight:600;padding:8px 14px;min-height:40px;cursor:pointer;color:var(--ink)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.langseg{flex:none}.langseg button{padding:4px 12px;min-height:36px;font-size:13px;letter-spacing:.04em}
.btn{font-weight:700;border-radius:10px;padding:12px 16px;min-height:46px;border:1px solid var(--ink);background:var(--ink);color:var(--on-ink);cursor:pointer;text-align:center}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.danger{background:transparent;color:var(--ink);border-color:var(--crit)}
.btn.danger[data-armed="1"]{background:var(--crit);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.linkbtn{background:none;border:0;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px 4px;color:var(--ink)}
a.linkbtn{display:inline-block}
.iconbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.iconbtn:disabled{opacity:.35;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.tag{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--ink2);border-radius:4px;padding:0 5px;margin-left:8px;color:var(--ink2);white-space:nowrap}

.daterow{display:flex;align-items:center;gap:8px}
.daterow .d{flex:1;text-align:center;font-weight:700;min-width:0}
.daterow .d small{display:block;font-weight:500;color:var(--ink2);font-size:12px}

.label{background:var(--surface);border:2px solid var(--ink);border-radius:4px;padding:12px 14px 14px}
.label-title{font-weight:900;font-size:24px;letter-spacing:-.03em;line-height:1.1}
.label-sub{font-size:13px;color:var(--ink2);margin-top:2px}
.rule-xl{height:10px;background:var(--ink);margin:8px 0 6px}
.rule-lg{height:5px;background:var(--ink);margin:12px 0 2px}
.cal-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.cal-name{font-weight:800;font-size:22px}
.cal-val{font-weight:900;font-size:56px;letter-spacing:-.04em;line-height:1}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--ink)}
.meter.over i{background:var(--serious)}
.meter.p i{background:var(--p)} .meter.c i{background:var(--c)} .meter.f i{background:var(--f)}
.cal-note{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--ink2);margin-top:8px;flex-wrap:wrap}
.cal-note b{color:var(--ink)}
.mrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:4px 10px;align-items:baseline;margin-top:10px}
.mrow .meter{grid-column:1/-1}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;align-self:center}
.sw.p{background:var(--p)} .sw.c{background:var(--c)} .sw.f{background:var(--f)}
.mname{font-weight:700}
.mval{font-variant-numeric:tabular-nums;text-align:right}
.mpct{font-weight:800;min-width:3.4ch;text-align:right;font-variant-numeric:tabular-nums}

.meal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:2px 14px}
.meal-head{display:flex;align-items:center;gap:10px;padding:10px 0}
.meal-head h3{font-size:16px;font-weight:800;flex:1}
.mk{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.addbtn{display:inline-flex;align-items:center;gap:4px;font-weight:700;border:1px solid var(--ink);background:transparent;border-radius:8px;padding:6px 10px;min-height:36px;cursor:pointer;color:var(--ink)}
.entry,.frow{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;cursor:pointer;color:inherit}
.emain,.fmain{display:flex;flex-direction:column;min-width:0;flex:1}
.emain b,.fmain b{font-weight:600;overflow-wrap:anywhere}
.emain small,.fmain small,.enum small,.fnum small{color:var(--ink2);font-size:12.5px}
.enum,.fnum{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.enum b,.fnum b{font-weight:800;font-variant-numeric:tabular-nums}
.empty-row{border-top:1px solid var(--line);padding:6px 0 8px;color:var(--ink2);font-size:14px}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px));z-index:5}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;border-top:4px solid transparent;padding:12px 2px 14px;font-weight:700;color:var(--ink2);cursor:pointer;font-size:13.5px}
.tabs button[aria-current="page"]{border-top-color:var(--ink);color:var(--ink)}

.form{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-weight:700;font-size:14px}
.fld small{font-weight:400;color:var(--ink2)}
.fld .hint{font-size:13px;color:var(--ink2);font-weight:400}
input[type=text],input[type=number],input[type=search],select{width:100%;min-height:46px;border:1px solid var(--axis);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:16px;color:var(--ink)}
input.edited{border-color:var(--ink);border-width:2px;padding:7px 11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ov{display:flex;flex-direction:column;gap:4px;min-width:0}
.ov>span{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.ov small{font-size:12.5px;color:var(--ink2)}
.err{color:var(--ink);font-weight:600;min-height:1.2em;font-size:14px}
.err:not(:empty)::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--crit);margin-right:6px}
.note-warn{display:flex;gap:8px;align-items:flex-start;font-size:14px;border-left:4px solid var(--serious);padding:6px 10px;background:var(--wash);border-radius:0 8px 8px 0}
.actions{display:flex;flex-direction:column;gap:8px}
.nudge{border-left:4px solid var(--serious)}

.overlay{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:16px;max-height:86%;padding-bottom:20px}}
.sheet-head{display:flex;align-items:center;gap:8px}
.sheet-head h2{flex:1;font-size:19px;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--axis);background:transparent;border-radius:999px;padding:6px 12px;min-height:36px;font-weight:600;cursor:pointer;color:var(--ink)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.sec-title{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-top:8px}
.results{display:flex;flex-direction:column}
.qty{display:flex;gap:8px;align-items:center}
.qty input{text-align:center;font-weight:800;font-size:20px;max-width:120px}
.cp{border:2px solid var(--ink);border-radius:4px;padding:10px 12px}
.cp .big{font-weight:900;font-size:40px;letter-spacing:-.03em;line-height:1}
.cp .big small{font-size:15px;font-weight:700;letter-spacing:0;margin-left:6px}
.cp .m3{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:8px;font-weight:700;font-variant-numeric:tabular-nums}
.cp .m3 span{display:inline-flex;align-items:center;gap:6px}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--ink);flex:none}
.scanbox{display:flex;flex-direction:column;gap:8px;border:1px dashed var(--axis);border-radius:10px;padding:12px}
.status{min-height:1.3em;font-size:14px;color:var(--ink2)}
.scanbox details{font-size:13px;color:var(--ink2)}
.scanbox pre{white-space:pre-wrap;font:12px/1.4 ui-monospace,Menlo,monospace;max-height:180px;overflow:auto;margin:6px 0 0}

.chart{padding-top:6px}
.plot{position:relative;height:190px;margin-left:44px;border-bottom:1px solid var(--axis)}
.gl{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--line)}
.gl span{position:absolute;left:-44px;top:-9px;width:38px;text-align:right;font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
.tl{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--ink);z-index:1}
.tl span{position:absolute;right:0;top:-21px;font-size:11px;font-weight:700;background:var(--surface);padding:0 4px;color:var(--ink)}
.cols{position:absolute;inset:0;display:flex}
.col{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;background:none;border:0;padding:0;cursor:pointer}
.bar{width:100%;max-width:22px;border-radius:4px 4px 0 0;background:var(--ink2);min-height:2px}
.bar.over{background:var(--serious)}
.col[aria-pressed="true"] .bar{outline:2px solid var(--ink);outline-offset:2px}
.xl{display:flex;margin-left:44px;margin-top:6px}
.xl span{flex:1;text-align:center;font-size:12px;color:var(--ink2);line-height:1.25;min-width:0}
.xl b{display:block;font-weight:700;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px}
.legend i.ln{width:16px;height:0;border-top:2px solid var(--ink);border-radius:0}
.readout{margin-top:10px;font-weight:600;min-height:1.4em}
.twrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.tbl th,.tbl td{padding:8px 6px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{border-top:0;font-size:12px;color:var(--ink2);font-weight:700}
.tbl tr.sum td{font-weight:800;border-top:2px solid var(--ink)}

.lc{display:block;max-width:100%;height:auto;overflow:visible}
.lc text{font:11px var(--font);fill:var(--ink2)}
.lc .grid{stroke:var(--line);stroke-width:1}
.lc .axis{stroke:var(--axis);stroke-width:1}
.lc .ln{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.lc .dot{fill:var(--ink2);stroke:var(--surface);stroke-width:2}
.lc .end{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.lc .hit{fill:transparent;cursor:pointer}
.lc .sel{fill:none;stroke:var(--ink);stroke-width:2}
.chart .chips{margin-bottom:10px}
.statrow{display:flex;flex-wrap:wrap;gap:8px 28px;margin-bottom:10px}
.stat{display:flex;flex-direction:column}
.stat b{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.stat small{font-size:12.5px;color:var(--ink2)}
.mealrow{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center}
.mealrow input{min-width:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);background:var(--ink);color:var(--on-ink);padding:10px 14px;border-radius:10px;font-weight:600;z-index:30;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.tact{background:none;border:0;color:inherit;font-weight:800;text-decoration:underline;margin-left:10px;cursor:pointer}
.list .frow:first-child{border-top:0}
.empty{color:var(--ink2);padding:6px 0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="app">
  <header id="top" class="top"></header>
  <main id="view" tabindex="-1"></main>
</div>
<nav id="tabs" class="tabs" aria-label="Sections" hidden></nav>
<div id="sheet-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<input id="imp-file" type="file" accept=".json,application/json" hidden>

<script>
(function(){
'use strict';

/* ==PURE_START== */
const DEFAULT_MEALS=[{id:'breakfast',label:'Breakfast'},{id:'lunch',label:'Lunch'},{id:'dinner',label:'Dinner'},{id:'snacks',label:'Snacks'}];
const ACT=[
  {id:'sedentary',label:'Mostly sitting',note:'Desk work, little planned exercise.',f:1.2},
  {id:'light',label:'Lightly active',note:'On your feet some, or 1 to 3 workouts a week.',f:1.375},
  {id:'moderate',label:'Moderately active',note:'3 to 5 workouts a week.',f:1.55},
  {id:'very',label:'Very active',note:'Hard training most days, or a physical job.',f:1.725}
];
const PACE={lose:{gentle:.10,steady:.15,faster:.20},gain:{gentle:.05,steady:.10,faster:.15}};
const PROT={lose:1.8,maintain:1.6,gain:1.6};
const LB=0.45359237, IN=2.54;
function r1(n){return Math.round(n*10)/10}
function r2(n){return Math.round(n*100)/100}
function fmt(n){return Math.round(n).toLocaleString('en-US')}
function g(n){return (n>=10||Number.isInteger(n))?String(Math.round(n)):String(r1(n))}
function calcTargets(p,kcalOv){
  const kg=+p.weightKg, cm=+p.heightCm, age=+p.age;
  if(!(kg>0&&cm>0&&age>=18&&age<=100)) return null;
  const act=ACT.find(a=>a.id===p.act)||ACT[1];
  const bmr=10*kg+6.25*cm-5*age+(p.sex==='female'?-161:5);
  const tdee=bmr*act.f;
  let kcal=tdee, clamped=false;
  if(p.goal==='lose'||p.goal==='gain'){
    const pct=PACE[p.goal][p.pace]||PACE[p.goal].steady;
    kcal=tdee*(p.goal==='lose'?1-pct:1+pct);
  }
  const floor=p.sex==='female'?1200:1500;
  if(kcal<floor){kcal=floor;clamped=true;}
  kcal=Math.round(kcal/10)*10;
  if(kcalOv!=null){kcal=kcalOv;clamped=false;}
  let prot=Math.round(kg*(PROT[p.goal]||1.6));
  prot=Math.min(prot,Math.floor(kcal*0.35/4));
  let fat=Math.round(kcal*0.25/9);
  let carbs=Math.round((kcal-prot*4-fat*9)/4);
  if(carbs<50){fat=Math.round(kcal*0.20/9);carbs=Math.round((kcal-prot*4-fat*9)/4);}
  carbs=Math.max(0,carbs);
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,protein:prot,carbs,fat,clamped,floor};
}
function effectiveTargets(p){
  const o=p.ov||{};
  const base=calcTargets(p,o.kcal!=null?o.kcal:null);
  if(!base) return null;
  const calc=calcTargets(p,null);
  return {kcal:o.kcal!=null?o.kcal:base.kcal,protein:o.protein!=null?o.protein:base.protein,carbs:o.carbs!=null?o.carbs:base.carbs,fat:o.fat!=null?o.fat:base.fat,base,calc};
}
function sumEntries(es){const t={kcal:0,p:0,c:0,f:0};for(const e of es){const q=+e.qty||0;t.kcal+=q*e.kcal;t.p+=q*e.p;t.c+=q*e.c;t.f+=q*e.f;}return t}
function pad2(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function parseYmd(s){const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)}
function addDays(s,n){const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)}
function niceTicks(max){
  let step=2000;
  for(const s of [250,500,1000,2000]){if(max/s<=4){step=s;break;}}
  const top=Math.ceil(max/step)*step; const ticks=[];
  for(let v=0;v<=top;v+=step) ticks.push(v);
  return {top,ticks};
}
function qtyStr(q){
  const w=Math.floor(q+1e-9), k=Math.round((q-w)*100)/100;
  const m={0:'',0.25:'¼',0.5:'½',0.75:'¾'};
  if(k in m){const s=(w?String(w):'')+m[k];return s||'0'}
  return String(r1(q));
}
function gramsOf(serv){
  const m=/(\d+(?:\.\d+)?)\s*(g|ml)(?![a-z])/i.exec(serv||'');
  return m?{n:parseFloat(m[1]),u:m[2].toLowerCase()}:null;
}
function titleCase(s){

function T(k,p){
  let s=(LANG==='es'&&ES[k]!=null)?ES[k]:k;
  if(p)s=s.replace(/\{(\w+)\}/g,(m,n)=>p[n]!=null?p[n]:m);
  return s;
}
function pickLang(){
  const l=D.settings.lang;
  if(l==='en'||l==='es')return l;
  return String((navigator.languages&&navigator.languages[0])||navigator.language||'en').toLowerCase().indexOf('es')===0?'es':'en';
}
function setLang(l){LANG=l;D.settings.lang=l;document.documentElement.lang=l;persist();}
const DEF_ES={breakfast:'Desayuno',lunch:'Almuerzo',dinner:'Cena',snacks:'Meriendas'};
function mealName(m){
  const d=DEFAULT_MEALS.find(x=>x.id===m.id);
  if(d&&(m.label===d.label||m.label===DEF_ES[m.id]))return LANG==='es'?DEF_ES[m.id]:d.label;
  return m.label;
}
function canonMeal(m){
  const d=DEFAULT_MEALS.find(x=>x.id===m.id);
  return (d&&(m.label===d.label||m.label===DEF_ES[m.id]))?d.label:m.label;
}
function macroLine(p,c,f){return T('P')+' '+g(p)+' · '+T('C')+' '+g(c)+' · '+T('F')+' '+g(f)}

/* ---------- state & storage (everything stays on this phone) ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36);
const todayStr=()=>ymd(new Date());
const KEY='miskalorias.v1';
const D={profile:null,foods:{},logs:{},body:{},settings:{usdaKey:'',lastBackup:'',meals:null,lang:null}};
const S={tab:'today',date:todayStr(),wkEnd:todayStr(),sheet:null,draft:null,lastRemoved:null,wk:[],pv:'cal',rng:'12w',mk:null,bdate:todayStr(),pts:[]};
function load(){
  try{
    const o=JSON.parse(localStorage.getItem(KEY)||'null');
    if(o){D.profile=o.profile||null;D.foods=o.foods||{};D.logs=o.logs||{};D.body=o.body||{};D.settings=Object.assign({usdaKey:'',lastBackup:'',meals:null,lang:null},o.settings);}
  }catch(e){}
}
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify(D));return true;}
  catch(e){toast(T('This phone would not save that. Storage may be full or blocked.'));return false;}
}
const getEntries=d=>(D.logs[d]&&D.logs[d].entries)||[];
function setEntries(d,es){if(es.length)D.logs[d]={entries:es};else delete D.logs[d];persist();}
function meals(){const m=D.settings.meals;return (Array.isArray(m)&&m.length)?m:DEFAULT_MEALS}
function mealLabel(id){const m=meals().find(x=>x.id===id);return m?mealName(m):T('Other')}
function recents(){
  const dates=Object.keys(D.logs).sort().reverse().slice(0,30), seen=new Set(), out=[];
  for(const d of dates){
    for(const e of D.logs[d].entries.slice().reverse()){
      const id=e.name+'|'+e.serv; if(seen.has(id))continue; seen.add(id);
      out.push({name:e.name,serv:e.serv,kcal:e.kcal,p:e.p,c:e.c,f:e.f,qty:e.qty,u:e.u,a:e.a,src:(e.foodId&&D.foods[e.foodId])?'ours':'recent',id:e.foodId});
      if(out.length>=8)return out;
    }
  }
  return out;
}

function fmtDate(s,opt){return parseYmd(s).toLocaleDateString(LANG==='es'?'es-US':'en-US',opt||{weekday:'short',month:'short',day:'numeric'})}
function renderTop(){
  $('#top').innerHTML='<div class="brand-row"><div class="brand">misKalorias</div><div class="seg langseg" role="group" aria-label="Language / Idioma"><button type="button" data-action="lang" data-v="en" aria-pressed="'+(LANG==='en')+'">EN</button><button type="button" data-action="lang" data-v="es" aria-pressed="'+(LANG==='es')+'">ES</button></div></div>';
}
function renderTabs(){
  const el=$('#tabs');
  if(!D.profile){el.hidden=true;return;}
  el.hidden=false;el.setAttribute('aria-label',T('Sections'));
  el.innerHTML='<div class="tabs-in">'+[['today','Today'],['foods','Foods'],['progress','Progress'],['targets','Profile'],['more','More']].map(t=>'<button type="button" data-action="tab" data-tab="'+t[0]+'"'+(S.tab===t[0]?' aria-current="page"':'')+'>'+T(t[1])+'</button>').join('')+'</div>';
}
function render(){
  renderTop();renderTabs();
  const v=$('#view');
  if(!D.profile&&S.tab!=='targets'){S.tab='targets';openTargets();}
  if(S.tab==='today')v.innerHTML=viewToday();
  else if(S.tab==='progress')v.innerHTML=viewProgress();
  else if(S.tab==='foods')v.innerHTML=viewFoods();
  else if(S.tab==='targets'){if(!S.draft)openTargets();v.innerHTML=viewTargets();updatePreview();}
  else if(S.tab==='more')v.innerHTML=viewMore();
}
function dateRow(kind){
  const isWk=kind==='week', cur=isWk?S.wkEnd:S.date, t=todayStr();
  let mid;

const isImp=()=>!D.profile||D.profile.units!=='metric';
const wUnit=()=>isImp()?'lb':'kg', mUnit=()=>isImp()?'in':'cm';
const dW=kg=>isImp()?r1(kg/LB):r1(kg), dM=cm=>isImp()?r1(cm/IN):r1(cm);
const bodyDates=()=>Object.keys(D.body).sort();
function bodySeries(key){return bodyDates().filter(d=>D.body[d][key]!=null).map(d=>({d:d,raw:D.body[d][key]}))}
function rangeCut(){const n={'4w':28,'12w':84}[S.rng];return n?addDays(todayStr(),-n):null}
function rangeWord(){return T({'4w':'over the last 4 weeks','12w':'over the last 12 weeks',all:'since the first entry'}[S.rng])}
function rngChips(){return '<div class="chips" role="group" aria-label="'+T('Time range')+'">'+[['4w','4 weeks'],['12w','12 weeks'],['all','All']].map(o=>'<button type="button" data-action="rng" data-v="'+o[0]+'" aria-pressed="'+(S.rng===o[0])+'">'+T(o[1])+'</button>').join('')+'</div>'}
function f1(n){return (Math.round(n*10)/10).toFixed(1)}
function sgn(n){const v=r1(n);return (v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(1)}
function longDate(d){return fmtDate(d,{month:'short',day:'numeric',year:'numeric'})}
function statHtml(l,v,sub){return '<div class="stat"><small>'+l+'</small><b>'+v+'</b>'+(sub?'<small>'+sub+'</small>':'')+'</div>'}
function chartW(){const v=document.getElementById('view');return Math.max(280,Math.min(600,(v?v.clientWidth:340)-30))}
function lineChart(pts,hasTrend,label){
  const W=chartW(),H=210,pl=46,pr=14,pt=14,pb=30,f=n=>Math.round(n*10)/10;
  const ys=pts.map(p=>p.v); if(hasTrend)pts.forEach(p=>ys.push(p.t));
  const nr=niceRange(Math.min.apply(null,ys),Math.max.apply(null,ys));
  const d0=pts[0].d, dn=pts[pts.length-1].d, span=Math.max(1,daysBetween(d0,dn));
  const X=d=>pl+daysBetween(d0,d)/span*(W-pl-pr), Y=v=>pt+(1-(v-nr.lo)/(nr.hi-nr.lo))*(H-pt-pb);
  let s='<svg class="lc" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="'+esc(label)+'">';
  nr.ticks.forEach((t,i)=>{s+='<line class="'+(i===0?'axis':'grid')+'" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+f(Y(t))+'" y2="'+f(Y(t))+'"/><text x="'+(pl-8)+'" y="'+f(Y(t)+4)+'" text-anchor="end">'+(Math.round(t*100)/100)+'</text>';});
  const yb=H-8, md={month:'short',day:'numeric'};
  s+='<text x="'+pl+'" y="'+yb+'" text-anchor="start">'+esc(fmtDate(d0,md))+'</text>';
  if(span>=14){const dm=addDays(d0,Math.round(span/2));s+='<text x="'+f(X(dm))+'" y="'+yb+'" text-anchor="middle">'+esc(fmtDate(dm,md))+'</text>';}
  s+='<text x="'+(W-pr)+'" y="'+yb+'" text-anchor="end">'+esc(fmtDate(dn,md))+'</text>';
  s+='<path class="ln" d="M'+pts.map(p=>f(X(p.d))+' '+f(Y(hasTrend?p.t:p.v))).join(' L')+'"/>';
  if(pts.length<=45)pts.forEach(p=>{s+='<circle class="dot" cx="'+f(X(p.d))+'" cy="'+f(Y(p.v))+'" r="4"/>';});
  const last=pts[pts.length-1];
  s+='<circle class="end" cx="'+f(X(last.d))+'" cy="'+f(Y(hasTrend?last.t:last.v))+'" r="5"/>';
  s+='<circle id="pt-sel" class="sel" r="9" cx="0" cy="0" style="display:none"/>';
  pts.forEach((p,i)=>{const cx=f(X(p.d)),cy=f(Y(p.v));s+='<circle class="hit" cx="'+cx+'" cy="'+cy+'" r="14" data-action="pt" data-i="'+i+'" data-cx="'+cx+'" data-cy="'+cy+'"/>';});
  return s+'</svg>';
}
function bodyForm(kind){
  const rec=D.body[S.bdate]||{}, t=todayStr(), w=kind==='weight';

  let fields;
  if(w)fields='<label class="fld"><span>'+T('Weight')+' ('+wUnit()+')</span><input id="b-w" type="number" inputmode="decimal" step="0.1" min="0" value="'+(rec.w!=null?dW(rec.w):'')+'"></label>';
  else fields='<div class="ov-grid">'+MEAS.map(m=>'<label class="ov"><span>'+T(m.label)+' ('+mUnit()+')</span><input id="b-'+m.id+'" type="number" inputmode="decimal" step="0.1" min="0" value="'+(rec[m.id]!=null?dM(rec[m.id]):'')+'"></label>').join('')+'</div>';

    '<p class="small">'+T(has?'Showing what is saved for this date. Clear a box and save to remove that value.':(w?'Weigh at the same time each day, such as first thing in the morning, so entries compare fairly.':'Measure the same spot the same way each time. All boxes are optional.'))+'</p></section>';
}
function saveBody(kind){
  const date=S.bdate, rec=Object.assign({},D.body[date]||{}), keys=kind==='weight'?['w']:MEAS.map(m=>m.id), box=$('#b-err');
  for(const k of keys){
    const raw=($('#b-'+k).value||'').trim().replace(',','.');
    if(raw===''){delete rec[k];continue;}
    const v=parseFloat(raw), metric=k==='w'?(isImp()?v*LB:v):(isImp()?v*IN:v), lim=bodyLimits(k);
    if(!(v>0)||metric<lim[0]||metric>lim[1]){box.textContent=T('Check the {what} number.',{what:T(k==='w'?'weight':MEAS.find(m=>m.id===k).label).toLowerCase()});return;}
    rec[k]=r2(metric);
  }
  if(Object.keys(rec).length)D.body[date]=rec;else delete D.body[date];
  if(!persist())return;
  render();toast(T('Saved'));
}
function weightNote(all){

}
function viewWeight(){
  const all=bodySeries('w'), unit=wUnit(), form=bodyForm('weight');
  if(!all.length){S.pts=[];return form+'<p class="small">'+T('Nothing logged yet. Two entries are enough to draw a line.')+'</p>';}
  const vals=all.map(p=>dW(p.raw)), tr=movAvg(vals,7);
  const full=all.map((p,i)=>({d:p.d,v:vals[i],t:tr[i]})), cut=rangeCut(), pts=full.filter(p=>!cut||p.d>=cut);
  const last=full[full.length-1];
  S.pts=pts.map(p=>fmtDate(p.d,{weekday:'short',month:'short',day:'numeric',year:'numeric'})+': '+f1(p.v)+' '+unit+' · '+T('trend')+' '+f1(p.t)+' '+unit);
  let chart;
  if(pts.length>=2){
    const ch=pts[pts.length-1].v-pts[0].v;
    chart='<div class="statrow">'+statHtml(T('Latest'),f1(last.v)+' '+unit,esc(longDate(last.d)))+statHtml(T('Change'),sgn(ch)+' '+unit,rangeWord())+statHtml(T('Trend'),f1(last.t)+' '+unit,T('average of last 7'))+'</div>'+
      lineChart(pts,true,T('Weight in {u} over time',{u:unit}))+
      '<div class="legend"><span><i style="background:var(--ink2);border-radius:50%"></i>'+T('Weigh-in')+'</span><span><i class="ln"></i>'+T('Trend (average of your last 7 weigh-ins)')+'</span></div>'+
      '<div id="pt-read" class="readout" aria-live="polite">'+T('Tap a point to see its value.')+'</div>';
  }else chart='<p class="small">'+T('Fewer than two entries in this range. Pick a longer range or add another weigh-in.')+'</p>';
  const rows=[];
  for(let j=full.length-1;j>=Math.max(0,full.length-60);j--){
    const p=full[j], prev=full[j-1];
    rows.push('<tr><td><button type="button" class="linkbtn" data-action="body-pick" data-d="'+p.d+'">'+esc(fmtDate(p.d,{month:'short',day:'numeric',year:'numeric'}))+'</button></td><td>'+f1(p.v)+' '+unit+'</td><td>'+(prev?sgn(p.v-prev.v):'')+'</td></tr>');
  }
  return form+weightNote(all)+'<section class="card"><h2 class="h2" style="margin-bottom:10px">'+T('Weight over time')+'</h2>'+rngChips()+'<div class="chart">'+chart+'</div></section>'+
    '<section class="card"><h2 class="h2" style="margin-bottom:6px">'+T('All weigh-ins')+'</h2><div class="twrap"><table class="tbl"><thead><tr><th>'+T('Date')+'</th><th>'+T('Weight')+'</th><th>'+T('Change')+'</th></tr></thead><tbody>'+rows.join('')+'</tbody></table></div></section>'+

function draftFrom(p){
  const imp=(p.units||'imperial')!=='metric', tin=p.heightCm/IN;
  let ft=Math.floor(tin/12), inch=Math.round(tin%12); if(inch===12){ft++;inch=0;}
  return {name:p.name,sex:p.sex,age:p.age,units:p.units||'imperial',w:imp?r1(p.weightKg/LB):p.weightKg,ft:ft,inch:inch,cm:p.heightCm,act:p.act,goal:p.goal,pace:p.pace||'steady',ov:Object.assign({},p.ov)};
}
function draftToProfile(d){
  const imp=d.units==='imperial', ov={};
  ['kcal','protein','carbs','fat'].forEach(k=>{if(Number.isFinite(d.ov[k]))ov[k]=d.ov[k];});
  return {name:d.name.trim(),sex:d.sex,age:+d.age,units:d.units,weightKg:imp?r1(d.w*LB):+d.w,heightCm:imp?Math.round(((+d.ft)*12+(+d.inch))*IN):Math.round(+d.cm),act:d.act,goal:d.goal,pace:d.pace,ov:ov};
}
function convertDraft(d,to){
  if(d.units===to)return;
  if(to==='metric'){d.w=r1(d.w*LB);d.cm=Math.round((d.ft*12+d.inch)*IN);}
  else{d.w=r1(d.w/LB);const t=d.cm/IN;d.ft=Math.floor(t/12);d.inch=Math.round(t%12);if(d.inch===12){d.ft++;d.inch=0;}}
  d.units=to;
}
function draftError(d){

  if(d.ov.kcal!=null&&(d.ov.kcal<800||d.ov.kcal>8000))return T('Calories need to be between 800 and 8,000. Below that, talk to a doctor first.');

function updatePreview(){
  const d=S.draft; if(!d||!$('#s-lead'))return;
  const p=draftToProfile(d), eff=effectiveTargets(p), lead=$('#s-lead'), warn=$('#s-warn'), pn=$('#pace-note');
  if(pn)pn.textContent=T(d.goal==='lose'?(d.pace==='faster'?'Works for a few weeks. Over months it costs more muscle and hunger.':'A pace most people can hold for months.'):(d.pace==='faster'?'A big surplus adds fat along with muscle.':'Slower gains keep more of it as muscle.'));
  const fields=['kcal','protein','carbs','fat'];
  if(!eff){lead.textContent=T('Fill in age, height and weight to see targets.');fields.forEach(k=>{$('#h-'+k).textContent='';});$('#s-sum').textContent='';warn.hidden=true;return;}
  const imp=d.units==='imperial', delta=eff.kcal-eff.calc.tdee, perWeek=imp?delta*7/3500:delta*7/7700, unit=imp?'lb':'kg';
  let txt=T('Maintenance is about {n} kcal a day.',{n:fmt(eff.calc.tdee)})+' ';
  if(Math.abs(delta)<40)txt+=T('Your target is about maintenance.');
  else txt+=T(delta<0?'Your target is {n} kcal below it, about {w} {u} lost per week.':'Your target is {n} kcal above it, about {w} {u} gained per week.',{n:fmt(Math.abs(delta)),w:r1(Math.abs(perWeek)),u:unit});
  lead.textContent=txt;
  const calc={kcal:eff.calc.kcal,protein:eff.base.protein,carbs:eff.base.carbs,fat:eff.base.fat};
  fields.forEach(k=>{
    const inp=$('#o-'+k), edited=d.ov[k]!=null;

    if(document.activeElement!==inp)inp.value=eff[k];
    $('#h-'+k).textContent=(edited?T('Edited.')+' ':'')+T('Calculated {n}',{n:fmt(calc[k])});
  });
  const sum=eff.protein*4+eff.carbs*4+eff.fat*9;
  $('#s-sum').textContent=T('Macros add up to {n} kcal.',{n:fmt(sum)});
  const msgs=[];
  if(eff.calc.clamped&&d.ov.kcal==null)msgs.push(T('The calorie target was raised to {n}, the usual minimum without a doctor’s guidance.',{n:fmt(eff.calc.floor)}));
  if(d.ov.kcal!=null&&d.ov.kcal<eff.calc.floor)msgs.push(T('That calorie target is below {n}, the usual minimum without a doctor’s guidance.',{n:fmt(eff.calc.floor)}));
  if(Math.abs(sum-eff.kcal)>eff.kcal*0.05)msgs.push(T(sum>eff.kcal?'The macros add up to {n} kcal more than the calorie target.':'The macros add up to {n} kcal less than the calorie target.',{n:fmt(Math.abs(sum-eff.kcal))}));
  warn.hidden=!msgs.length;
  warn.innerHTML=msgs.length?ico('warn')+'<span>'+msgs.map(esc).join(' ')+'</span>':'';
}

async function fetchJSON(url){
  const ac=new AbortController(), t=setTimeout(()=>ac.abort(),15000);
  try{
    const r=await fetch(url,{signal:ac.signal});
    if(!r.ok){const e=new Error('http '+r.status);e.status=r.status;throw e;}
    return await r.json();
  }finally{clearTimeout(t);}
}
function errMsg(e,name,demo){
  const P={name:name};
  if(e&&e.name==='AbortError')return T('{name} took too long to answer. Try again.',P);
  if(e&&e.status===429)return T(demo?'{name} has used up the shared demo key. Add your own free key in More.':'{name} says too many requests. Try again in a while.',P);
  if(e&&(e.status===401||e.status===403))return T('{name} rejected the key. Check it in More.',P);
  if(e&&e.status)return T('{name} returned an error ({code}).',{name:name,code:e.status});
  if(navigator.onLine===false)return T('You are offline, so {name} could not be searched.',P);
  return T('Could not reach {name}. If other sites load, it may be down or blocking this app.',P);
}
async function runOnline(){
  const sh=S.sheet; if(!sh||sh.step!=='search')return;
  const q=(sh.q||'').trim();
  if(q.length<2){toast(T('Type at least two letters first.'));return;}
  sh.online={q:q,busy:true,groups:[]};renderOnline();
  const demo=!D.settings.usdaKey, key=D.settings.usdaKey||'DEMO_KEY';
  const res=await Promise.allSettled([fetchJSON(usdaUrl(q,key)),fetchJSON(offUrl(q))]);
  if(S.sheet!==sh||!sh.online||sh.online.q!==q)return;
  const groups=[];
  const names=['USDA FoodData Central','Open Food Facts'], parsers=[parseUSDA,parseOFF], short=['USDA','Open Food Facts'];
  res.forEach((r,i)=>{
    if(r.status==='fulfilled'){const items=parsers[i](r.value);groups.push({name:names[i],items:items,msg:items.length?'':T('No matches with calorie data.')});}
    else groups.push({name:names[i],items:[],msg:errMsg(r.reason,short[i],i===0&&demo)});
  });
  sh.online={q:q,busy:false,groups:groups};renderOnline();
}

function openAdd(meal){S.sheet={kind:'add',step:'search',meal:meal,q:'',list:[],onl:[],online:null};renderSheet();}
function closeSheet(){S.sheet=null;renderSheet();}
function readQty(){
  const sh=S.sheet, v=parseFloat(($('#qty').value||'').replace(',','.'));
  if(!(v>0))return null;
  const gm=gramsOf(sh.food.serv);
  return (sh.unit==='g'&&gm)?v/gm.n:v;
}
function updateConfirm(){
  const sh=S.sheet; if(!sh||sh.step!=='confirm')return;
  const q=readQty();
  if(q){sh.qty=q;$('#cp').innerHTML=cpHtml(sh.food,q);$('#q-err').textContent='';}
}
function updateCreateHint(){
  const h=$('#c-hint');if(!h)return;
  const v=id=>parseFloat(($('#'+id).value||'').replace(',','.'))||0;
  const m=v('c-p')*4+v('c-c')*4+v('c-f')*9;
  h.textContent=m>0?T('Macros add up to {n} kcal. Labels round, so a small gap is normal. Leave calories blank to use this number.',{n:fmt(m)}):'';
}
function numVal(id){const s=($('#'+id).value||'').trim().replace(',','.');return s===''?null:parseFloat(s)}
function submitCreate(){
  const sh=S.sheet, err=$('#c-err');
  const name=$('#c-name').value.trim(), serv=$('#c-serv').value.trim()||T('1 serving');
  let kcal=numVal('c-kcal'); const p=numVal('c-p')||0, c=numVal('c-c')||0, f=numVal('c-f')||0;
  if(!name){err.textContent=T('Add a name.');return;}
  if([kcal,p,c,f].some(x=>x!=null&&!(x>=0))){err.textContent=T('Numbers cannot be negative.');return;}
  if(kcal==null){if(p+c+f===0){err.textContent=T('Add the calories or at least one macro.');return;}kcal=p*4+c*4+f*9;}
  const food={name:name,serv:serv,kcal:Math.round(kcal),p:r1(p),c:r1(c),f:r1(f)};
  if(sh.food&&sh.food.brand)food.brand=sh.food.brand;
  if(sh.kind==='food'){
    D.foods[sh.foodId||uid()]=food;persist();closeSheet();render();toast(T('Saved to my foods'));return;
  }
  const box=$('#c-save');
  if(box&&box.checked){const id=uid();D.foods[id]=food;persist();food.foodId=id;}
  sh.food=food;sh.qty=1;sh.unit=/^100 g$/i.test(serv)?'g':'serv';sh.step='confirm';renderSheet();
}
function commitEntry(){
  const sh=S.sheet, q=readQty();
  if(!(q>0)){$('#q-err').textContent=T('Enter an amount above zero.');return;}
  const f=sh.food, gm=gramsOf(f.serv);
  let foodId=f.foodId||null;
  const box=$('#q-save');
  if(!sh.entryId&&box&&box.checked&&!foodId){
    foodId=uid();
    const saved={name:f.name,serv:f.serv,kcal:f.kcal,p:f.p,c:f.c,f:f.f};
    if(f.brand)saved.brand=f.brand;
    D.foods[foodId]=saved;
  }
  const entry={id:sh.entryId||uid(),meal:sh.meal,name:f.name,serv:f.serv,qty:q,kcal:f.kcal,p:f.p,c:f.c,f:f.f,foodId:foodId};
  if(sh.unit==='g'&&gm){entry.u='g';entry.a=Math.round(q*gm.n);}
  const es=clone(getEntries(S.date));
  const i=sh.entryId?es.findIndex(e=>e.id===sh.entryId):-1;
  if(i>=0)es[i]=entry;else es.push(entry);
  setEntries(S.date,es);closeSheet();render();
  toast(sh.entryId?T('Saved'):T('Added {name}',{name:f.name}));
}

/* ---------- label scanning (reads the photo on this phone) ---------- */
let tessLoad=null;
/* the reader (Tesseract.js 5.1.1, Apache-2.0) and its English and Spanish data ship inside the app, so scanning works offline */
const VENDOR=new URL('vendor/tesseract/',location.href).href;
function loadTesseract(){
  if(window.Tesseract)return Promise.resolve();
  if(tessLoad)return tessLoad;
  tessLoad=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=VENDOR+'tesseract.min.js';
    s.onload=res;s.onerror=()=>{tessLoad=null;rej(new Error('load'));};
    document.head.appendChild(s);
  });
  return tessLoad;
}
async function prepImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=new Image(); img.src=url; await img.decode();
    const max=1800, sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round(img.naturalWidth*sc)); cv.height=Math.max(1,Math.round(img.naturalHeight*sc));
    const cx=cv.getContext('2d'); cx.drawImage(img,0,0,cv.width,cv.height);
    const im=cx.getImageData(0,0,cv.width,cv.height), d=im.data, hist=new Array(256).fill(0), n=d.length/4;
    for(let i=0;i<d.length;i+=4){const y=Math.round(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2]);d[i]=y;hist[y]++;}
    let acc=0,lo=0,hi=255;
    for(let v=0;v<256;v++){acc+=hist[v];if(acc>=n*0.02){lo=v;break;}}
    acc=0;for(let v=255;v>=0;v--){acc+=hist[v];if(acc>=n*0.02){hi=v;break;}}
    const span=Math.max(40,hi-lo);
    for(let i=0;i<d.length;i+=4){const y=Math.max(0,Math.min(255,Math.round((d[i]-lo)*255/span)));d[i]=d[i+1]=d[i+2]=y;}
    cx.putImageData(im,0,0);
    return cv;
  }finally{URL.revokeObjectURL(url);}
}
async function scanLabel(file){
  const st=$('#scan-status'), out=$('#scan-out'); if(!st)return;
  out.innerHTML='';
  st.textContent=T('Preparing the photo…');
  let cv;
  try{cv=await prepImage(file);}catch(e){st.textContent=T('That photo could not be opened. Try another one.');return;}
  try{
    st.textContent=T('Loading the label reader…');
    await loadTesseract();
    const worker=await Tesseract.createWorker('eng+spa',1,{
      workerPath:VENDOR+'worker.min.js',corePath:VENDOR+'core/',langPath:VENDOR+'lang',
      logger:m=>{
        const s=$('#scan-status'); if(!s)return;
        if(m.status==='recognizing text')s.textContent=T('Reading the label…')+' '+Math.round(m.progress*100)+'%';
        else if(/load|initializ/.test(m.status))s.textContent=T('Loading the label reader…');
      }});
    await worker.setParameters({tessedit_pageseg_mode:Tesseract.PSM.SINGLE_COLUMN});
    const r=await worker.recognize(cv);
    let text=r.data.text||'', best=parseLabel(text);
    if(best.missing.length||best.mismatch){
      /* a second read with automatic page layout sometimes catches what the first missed */
      const s2=$('#scan-status'); if(s2)s2.textContent=T('Trying a second reading…');
      await worker.setParameters({tessedit_pageseg_mode:Tesseract.PSM.AUTO});
      const r2=await worker.recognize(cv), t2=r2.data.text||'', p2=parseLabel(t2);
      if(pickBetter(best,p2)===p2&&p2!==best){text=t2;best=p2;}
    }
    await worker.terminate();
    applyScan(text);
  }catch(e){
    const s=$('#scan-status'); if(!s)return;
    s.textContent=T('The label reader failed. Try a sharper, straighter photo with the whole panel in view, or type the numbers in.');
  }
}
function applyScan(text){
  const st=$('#scan-status'), out=$('#scan-out'); if(!st)return;
  const r=parseLabel(text);
  const setv=(id,v)=>{if(v!=null)$('#'+id).value=v;};
  if(r.serv)$('#c-serv').value=r.serv;
  setv('c-kcal',r.kcal);setv('c-p',r.p);setv('c-c',r.c);setv('c-f',r.f);
  updateCreateHint();
  const msgs=[];
  if(r.missing.length===4)msgs.push(T('Nothing readable was found. Try again with the whole Nutrition Facts panel in view, flat and well lit, or type the numbers in.'));
  else{
    msgs.push(T('Filled in what could be read. Check every number against the label before saving.'));
    if(r.missing.length)msgs.push(T('Not found: {list}.',{list:r.missing.map(x=>T(x)).join(', ')}));
    msgs.push(T(r.serv?'The serving size is the least reliable part of a scan, so read it twice.':'Serving size not found.'));
    if(r.notes.indexOf('nine')>-1)msgs.push(T('A stray 9 after a number was dropped, probably a misread “g”.'));
    if(r.mismatch)msgs.push(T('The calories and macros do not line up, so at least one number is likely misread.'));
  }
  if(!$('#c-name').value.trim())msgs.push(T('Add the product name.'));
  st.textContent=msgs.join(' ');
  out.innerHTML='<details><summary>'+T('Text the reader found')+'</summary><pre>'+esc(text)+'</pre></details>';
}

/* ---------- backup, sharing, import ---------- */
function download(name,text){
  const b=new Blob([text],{type:'application/json'}), a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
async function shareOrDownload(name,text){
  try{
    const f=new File([text],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return true;}
  }catch(e){if(e&&e.name==='AbortError')return false;}
  download(name,text);return true;
}
async function exportAll(){
  const data={kind:'backup',v:3,exported:new Date().toISOString(),profile:D.profile,foods:D.foods,logs:D.logs,body:D.body,meals:D.settings.meals};
  if(await shareOrDownload('miskalorias-backup-'+todayStr()+'.json',JSON.stringify(data))){D.settings.lastBackup=new Date().toISOString();persist();render();}
}
async function exportFoods(){
  const arr=Object.keys(D.foods).map(id=>D.foods[id]);
  if(!arr.length){toast(T('No saved foods to share yet.'));return;}
  await shareOrDownload('miskalorias-foods.json',JSON.stringify({kind:'foods',v:2,foods:arr}));
}
function importFile(file){
  const rd=new FileReader();
  rd.onload=()=>{
    let data;try{data=JSON.parse(rd.result);}catch(e){toast(T('That file is not a misKalorias export.'));return;}
    if(data&&data.kind==='foods'&&Array.isArray(data.foods)){
      const have=new Set(Object.keys(D.foods).map(id=>(D.foods[id].name+'|'+D.foods[id].serv).toLowerCase()));
      let added=0;
      data.foods.forEach(f=>{
        if(!f||!f.name||!f.serv||!(f.kcal>=0))return;
        const k=(f.name+'|'+f.serv).toLowerCase(); if(have.has(k))return;
        have.add(k);
        D.foods[uid()]={name:String(f.name),serv:String(f.serv),kcal:+f.kcal||0,p:+f.p||0,c:+f.c||0,f:+f.f||0,brand:f.brand?String(f.brand):undefined};
        added++;
      });
      persist();render();toast(added?T(added===1?'Added {n} food':'Added {n} foods',{n:added}):T('Those foods are already here.'));
    }else if(data&&data.kind==='backup'&&data.logs&&data.foods){
      S.sheet={kind:'import',data:data,days:Object.keys(data.logs).length,nfoods:Object.keys(data.foods).length};renderSheet();
    }else toast(T('That file is not a misKalorias export.'));
  };
  rd.readAsText(file);
}
function eraseAll(){
  try{localStorage.removeItem(KEY);}catch(e){}
  D.profile=null;D.foods={};D.logs={};D.body={};D.settings={usdaKey:'',lastBackup:'',meals:null,lang:LANG};

}

    case 'copy-today':{
      const f=sh.food, es=clone(getEntries(todayStr())), ent={id:uid(),meal:sh.meal,name:f.name,serv:f.serv,qty:sh.qty,kcal:f.kcal,p:f.p,c:f.c,f:f.f,foodId:f.foodId||null};
      if(sh.unit==='g'){const gm=gramsOf(f.serv);if(gm){ent.u='g';ent.a=Math.round(sh.qty*gm.n);}}
      es.push(ent);setEntries(todayStr(),es);closeSheet();render();toast(T('Added to today'));break;}
    case 'copy-prev':{
      const meal=el.dataset.meal, prev=getEntries(addDays(S.date,-1)).filter(x=>x.meal===meal); if(!prev.length)break;
      const es=clone(getEntries(S.date));
      prev.forEach(x=>es.push(Object.assign({},clone(x),{id:uid()})));
      setEntries(S.date,es);render();toast(T(prev.length===1?'Copied {n} item':'Copied {n} items',{n:prev.length}));break;}
    case 'food-new':S.sheet={kind:'food',step:'create',foodId:null,food:{}};renderSheet();break;
    case 'food-edit':{const f=D.foods[el.dataset.id]; if(!f)break;S.sheet={kind:'food',step:'create',foodId:el.dataset.id,food:f};renderSheet();break;}
    case 'food-delete':
      if(el.dataset.armed==='1'){delete D.foods[sh.foodId];persist();closeSheet();render();toast(T('Deleted. Past log entries keep their numbers.'));}
      else{el.dataset.armed='1';el.textContent=T('Tap again to delete');clearTimeout(armT);armT=setTimeout(()=>{el.dataset.armed='0';el.textContent=T('Delete this food');},4000);}
      break;
    case 'seg':{
      const k=el.dataset.key,v=el.dataset.val,d=S.draft;
      if(k==='units')convertDraft(d,v);else d[k]=v;
      if(k==='goal'&&v!=='maintain'&&!PACE[v][d.pace])d.pace='steady';
      $('#view').innerHTML=viewTargets();updatePreview();break;}
    case 'reset-ov':S.draft.ov={};updatePreview();break;
    case 'save-profile':saveProfile();break;
    case 'cancel-profile':S.draft=null;S.tab='today';render();break;
    case 'save-key':D.settings.usdaKey=($('#s-key').value||'').trim();persist();toast(T(D.settings.usdaKey?'Key saved':'Key cleared. The shared demo key will be used.'));break;
    case 'export-all':exportAll();break;
    case 'export-foods':exportFoods();break;
    case 'restore':$('#imp-file').click();break;
    case 'import-go':{
      const d=sh.data;
      D.profile=d.profile||null;D.foods=d.foods||{};D.logs=d.logs||{};D.body=d.body||{};D.settings.meals=Array.isArray(d.meals)?d.meals:null;
      persist();S.sheet=null;renderSheet();S.draft=null;S.tab=D.profile?'today':'targets';render();toast(T('Backup restored'));break;}
    case 'lang':if(el.dataset.v!==LANG){setLang(el.dataset.v);render();renderSheet();}break;
    case 'pv':S.pv=el.dataset.v;render();break;
    case 'rng':S.rng=el.dataset.v;render();break;
    case 'mk':S.mk=el.dataset.v;render();break;
    case 'pt':{
      const txt=S.pts[+el.dataset.i], rd=$('#pt-read'), sel=$('#pt-sel'); if(!txt||!rd||!sel)break;
      rd.textContent=txt;sel.setAttribute('cx',el.dataset.cx);sel.setAttribute('cy',el.dataset.cy);sel.style.display='';break;}
    case 'body-pick':S.bdate=el.dataset.d;render();window.scrollTo(0,0);break;
    case 'save-body':saveBody(el.dataset.kind);break;
    case 'use-latest':{
      const all=bodySeries('w'), l=all[all.length-1]; if(!l)break;
      D.profile.weightKg=l.raw;persist();S.draft=null;render();toast(T('Targets now use {a}',{a:dW(l.raw)+' '+wUnit()}));break;}
    case 'goto-progress':S.tab='progress';S.pv='weight';S.draft=null;render();window.scrollTo(0,0);break;
    case 'meals-edit':S.sheet={kind:'meals',list:clone(meals()).map(m=>({id:m.id,label:mealName(m)})),focus:null};renderSheet();break;
    case 'meal-up':{const i=+el.dataset.i;if(i>0){const t=sh.list[i];sh.list[i]=sh.list[i-1];sh.list[i-1]=t;renderSheet();}break;}
    case 'meal-down':{const i=+el.dataset.i;if(i<sh.list.length-1){const t=sh.list[i];sh.list[i]=sh.list[i+1];sh.list[i+1]=t;renderSheet();}break;}
    case 'meal-del':if(sh.list.length>1){sh.list.splice(+el.dataset.i,1);renderSheet();}break;
    case 'meal-add':if(sh.list.length<10){sh.list.push({id:uid(),label:''});sh.focus=sh.list.length-1;renderSheet();}break;
    case 'meals-save':{
      const list=sh.list.map(m=>({id:m.id,label:canonMeal({id:m.id,label:m.label.trim()})}));
      if(list.some(m=>!m.label)){$('#m-err').textContent=T('Every meal needs a name.');break;}
      D.settings.meals=list;persist();closeSheet();render();toast(T('Meals saved'));break;}
    case 'erase':
      if(el.dataset.armed==='1')eraseAll();
      else{el.dataset.armed='1';el.textContent=T('Tap again to erase everything');clearTimeout(armT);armT=setTimeout(()=>{el.dataset.armed='0';el.textContent=T('Erase everything');},4000);}
      break;
  }
});
document.addEventListener('input',e=>{
  const id=e.target.id, d=S.draft; if(!id)return;
  if(/^m-\d+$/.test(id)&&S.sheet&&S.sheet.kind==='meals'){const m=S.sheet.list[+id.slice(2)];if(m)m.label=e.target.value;return;}
  if(id==='q'){S.sheet.q=e.target.value;S.sheet.online=null;fillResults();renderOnline();return;}
  if(id==='qty'){updateConfirm();return;}
  if(id.indexOf('c-')===0&&id!=='c-photo'){updateCreateHint();return;}
  if(!d)return;
  if(id.indexOf('o-')===0){
    const k=id.slice(2), raw=e.target.value.trim(), v=parseFloat(raw);
    if(raw===''||!(v>=0))delete d.ov[k];else d.ov[k]=Math.round(v);
    updatePreview();return;
  }
  if(id==='f-name')d.name=e.target.value;
  else if(id==='f-age')d.age=+e.target.value;
  else if(id==='f-w')d.w=+e.target.value;
  else if(id==='f-ft')d.ft=+e.target.value;
  else if(id==='f-in')d.inch=+e.target.value;
  else if(id==='f-cm')d.cm=+e.target.value;
  else return;
  updatePreview();
});
document.addEventListener('change',e=>{
  const id=e.target.id, d=S.draft;
  if(id==='b-date'){const v=e.target.value;if(/^\d{4}-\d{2}-\d{2}$/.test(v)&&v<=todayStr()){S.bdate=v;render();}return;}
  if(id==='c-photo'){const f=e.target.files&&e.target.files[0];e.target.value='';if(f)scanLabel(f);return;}
  if(id==='imp-file'){const f=e.target.files&&e.target.files[0];e.target.value='';if(f)importFile(f);return;}
  if(!d)return;
  if(id==='f-act'){d.act=e.target.value;const a=ACT.find(x=>x.id===d.act);$('#act-note').textContent=actNote(a);updatePreview();}
  if(id==='f-pace'){d.pace=e.target.value;updatePreview();}
});
document.addEventListener('submit',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.sheet)closeSheet();
  if(e.key==='Enter'&&e.target&&e.target.id==='q'){e.preventDefault();runOnline();}
});

let lastW=0;
window.addEventListener('resize',()=>{if(S.tab!=='progress'||S.sheet)return;const v=$('#view');if(!v)return;const w=v.clientWidth;if(Math.abs(w-lastW)>40){lastW=w;render();}});
load();
LANG=pickLang();document.documentElement.lang=LANG;
if(!D.profile){S.tab='targets';openTargets();}
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
})();
</script>
</body>
</html>
